<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cube Analyzer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/cube.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/solve.js"></script>
    
    <link rel="stylesheet" href="./styles.css">
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="rotationPanel">
        <div>
            <div class="panel-section-title">Face Rotations</div>
            <div class="rot-grid-4" id="faceRotGrid"></div>
        </div>
        <div>
            <div class="panel-section-title">Cube Rotations</div>
            <div class="rot-grid-3" id="cubeRotGrid"></div>
        </div>
    </div>

    <div id="controls">
        <div class="control-row">
            <input type="text" id="algoInput" placeholder="Algorithm goes here..." value="R U R' U'">
        </div>

        <div class="control-row">
            <button id="runBtn" class="btn-action">Run</button>
            <button id="solveBtn" class="btn-success">Solve</button>
            <button id="shuffleBtn" class="btn-warn">Shuffle</button>
            <button id="undoBtn" class="btn-neutral">Undo</button>
            <button id="resetBtn" class="btn-danger">Reset</button>
            <button id="toggleRotPanelBtn" class="btn-icon" title="Toggle Advanced Controls">🎮</button>
        </div>

        <div id="quickActions">
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
